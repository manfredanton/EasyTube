
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyTube</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#FF0000" />
</head>

<body>
    <div id="app">
        <div class="spinner-box" style="padding-top: 80px;">
            <div class="spinner"></div>
            <span style="color: #757575; font-size: 17px;">EasyTube wird geladen...</span>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        Ein Fehler ist aufgetreten.
        <a href="." class="reload">Neu laden</a>
    </div>

    <script>
        // SPA Redirect Handler für GitHub Pages
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>

    <script>
        // Blendet auf mobilen Geräten die Bildschirmtastatur aus
        window.easyTube = {
            blurActiveElement: function () {
                var el = document.activeElement;
                if (el && typeof el.blur === 'function') {
                    el.blur();
                }
            },
            supportsSpeechRecognition: function () {
                return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
            },
            startVoiceSearch: function () {
                return new Promise(function (resolve, reject) {
                    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        reject(new Error("Spracherkennung wird von diesem Browser nicht unterstützt."));
                        return;
                    }

                    var recognition = new SpeechRecognition();
                    recognition.lang = "de-DE";
                    recognition.interimResults = false;
                    recognition.maxAlternatives = 1;
                    recognition.onresult = function (event) {
                        resolve(event.results[0][0].transcript);
                    };
                    recognition.onerror = function () {
                        reject(new Error("Die Spracheingabe konnte nicht verstanden werden."));
                    };
                    recognition.onnomatch = function () {
                        reject(new Error("Die Spracheingabe konnte nicht verstanden werden."));
                    };
                    recognition.start();
                });
            }
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if (window.location.hostname !== 'localhost') {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>

</html>
